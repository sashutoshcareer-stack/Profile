<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon: AS monogram -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <!-- SEO -->
    <title>Ashutosh Srivastava | Senior AI Engineer</title>
    <meta
      name="description"
      content="Senior AI Engineer and Full Stack Engineer with 8+ years of experience building production-grade AI systems, LLM pipelines, and enterprise applications for Fortune 500 clients."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ashutosh Srivastava | Senior AI Engineer" />
    <meta
      property="og:description"
      content="Senior AI Engineer and Full Stack Engineer with 8+ years of experience building production-grade AI systems, LLM pipelines, and enterprise applications for Fortune 500 clients."
    />
    <meta property="og:locale" content="en_GB" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Ashutosh Srivastava | Senior AI Engineer" />
    <meta
      name="twitter:description"
      content="Senior AI Engineer and Full Stack Engineer with 8+ years of experience building production-grade AI systems, LLM pipelines, and enterprise applications for Fortune 500 clients."
    />

    <!-- Google Fonts: Inter + Space Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- No-flash theme script: runs before first paint -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var theme = stored ? stored : prefersDark ? 'dark' : 'light'
          var root = document.documentElement
          if (theme === 'dark') {
            root.classList.add('dark')
            root.classList.remove('light')
          } else {
            root.classList.remove('dark')
            root.classList.add('light')
          }
        } catch (_) {}
      })()
    </script>
  </head>
  <body class="bg-zinc-50 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 font-sans">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
